name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    if: >-
      github.repository == 'Melivo/opencode-model-fallback' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.RELEASE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.11"
          no-cache: true
      - name: Pin npm with OIDC support
        run: |
          npm install --global npm@11.20.0
          test "$(npm --version)" = "11.20.0"
          echo "RELEASE_NPM=$(command -v npm)" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - name: Require bootstrap baseline and current event commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git rev-parse --verify 'refs/tags/melivo-v0.1.0^{commit}'
          git merge-base --is-ancestor 'refs/tags/melivo-v0.1.0^{commit}' HEAD
      - run: bun test
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build
      - name: Prepare, test exact archive, publish through OIDC
        run: bun run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Preserve bounded release recovery evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-artifacts/*.tgz
            release-artifacts/tested.sha512
            release-artifacts/registry-check.json
          if-no-files-found: ignore
          retention-days: 7
